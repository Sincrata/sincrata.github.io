<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawbreaker Bat Dollmaker</title>
    <link rel="stylesheet" href="css/dollmaker.css">
    <link rel="stylesheet" href="css/jawbreaker.css">
    <style>

    </style>
</head>
<body>
    
    <main>
        <img src="assets/jawbreaker-logo.png" id="main-logo" alt="Jawbreaker Bats"/>
        <div id="dollmaker">
            <div id="preview">
                <div id="buttons">
                    <a id="save"><img src="https://static.thenounproject.com/png/2853302-200.png" alt="save"></a>
                    <a id="random"><img src="https://icons.veryicon.com/png/o/object/material_design_icons/dice-7.png" alt="randomize"></a>
                    <a id="clear"><img src="https://cdn-icons-png.flaticon.com/512/2618/2618245.png" alt="clear"></a>
                </div>
                <img src="assets/preview-bat.png" style="max-width: 100%;">
            </div>
            <div id="selection-bar">
                    <div class="category selected">Body</div>
                    <div class="category">Markings</div>
                    <div class="category">Antenna</div>
                    <div class="category">Teeth</div>
                    <div class="category">Tongue</div>
                    <div class="category">Tail</div>
                    <div class="category">Wings</div>
                    <div class="category">Horn</div>
                    <div class="category">Ears</div>
                    <div class="category">Background</div>
            </div>
            <div id="colors">
                <div class="color" data-hex="#bd3d0b" style="background-color:#bd3d0b"></div>
                <div class="color" data-hex="#eaa527" style="background-color:#eaa527"></div>
                <div class="color" data-hex="#eae027" style="background-color:#eae027"></div>
                <div class="color" data-hex="#58ca36" style="background-color:#58ca36"></div>
                <div class="color" data-hex="#36a5ca" style="background-color:#36a5ca"></div>
                <div class="color" data-hex="#3643ca" style="background-color:#3643ca"></div>
                <div class="color" data-hex="#7436ca" style="background-color:#7436ca"></div>
                <div class="color" data-hex="#ffffff" style="background-color:#ffffff"></div>
                <div class="color" data-hex="#929292" style="background-color:#929292"></div>
                <div class="color" data-hex="#262626" style="background-color:#262626"></div>
                <div class="color" data-hex="#693a13" style="background-color:#693a13"></div>
                <div class="color" data-hex="#bd3d0b" style="background-color:#bd3d0b"></div>
                <div class="color" data-hex="#eaa527" style="background-color:#eaa527"></div>
                <div class="color" data-hex="#eae027" style="background-color:#eae027"></div>
                <div class="color" data-hex="#58ca36" style="background-color:#58ca36"></div>
                <div class="color" data-hex="#36a5ca" style="background-color:#36a5ca"></div>
                <div class="color" data-hex="#3643ca" style="background-color:#3643ca"></div>
                <div class="color" data-hex="#7436ca" style="background-color:#7436ca"></div>
                <div class="color" data-hex="#ffffff" style="background-color:#ffffff"></div>
                <div class="color" data-hex="#929292" style="background-color:#929292"></div>
                <div class="color" data-hex="#262626" style="background-color:#262626"></div>
                <div class="color" data-hex="#693a13" style="background-color:#693a13"></div>
                <div class="custom"><input type="color"></div>
            </div>
            <div id="features">
                <div class="feature"><img data-type="body" data-feature="straight" src="assets/dollmakers/jawbreaker-bat/body/straight.png">Straight</div>
                <div class="feature"><img data-type="body" data-feature="curled" src="assets/dollmakers/jawbreaker-bat/body/curled.png">Curled</div>
            </div>
        </div>

    </main>
    
    
</body>
</html>
